<!DOCTYPE html>
<html>
    <head>
	    <link rel="stylesheet" href="styles.css">
    </head>
    <body>
 
        <div class="joinContainer">
            <div class="usernamePrompt">
                <input id="userInput">
            </div>

            <div class="joinBtnContainer">
                <button class="joinBtn" id="joinBtn">Join Game</button>
            </div>
            
            <div class="startGameContainer">
                <button class="startGameBtn" id="startGameBtn">Start Game</button>
            </div>

            <div class="endTurnContainer">
                <button class="endTurnBtn" id="endTurnBtn">End Turn</button>
            </div>
            <div class="surrenderContainer">
                <button class="surrenderBtn" id="surrenderBtn">Surrender</button>
            </div>
        </div>
        <div id="mapContainer" class="mapHexContainer">

        </div>

        <div class="moneyContainer">
            <p1 class="money">0</p1>
        </div>

        <div class="turnContainer" style="display: flex; position: absolute; left: 25%; top: 10px; border: 2px solid black; background-color: rgb(190, 209, 209);;">
            <span id="currentTurn">The game has not begun</span>
        </div>

        <div class="storeContainer">
            <div class="itemStore">
                <img class="storeUnit" id="1" src="https://tinkr.tech//sdb_apps/antiyoy/images/unit_peasant.svg">
                <span class="price">Price:10G</span>
            </div>
           <div>
                <img class="storeUnit" id="2" src="https://tinkr.tech//sdb_apps/antiyoy/images/unit_spearman.svg">
                 <span class="price">Price:20G</span>
            </div>
           <div>
                <img class="storeUnit" id="3" src="https://tinkr.tech//sdb_apps/antiyoy/images/unit_baron.svg">
                <span class="price">Price:30G</span>
            </div>
           <div>
                <img class="storeUnit" id="4" src="https://tinkr.tech//sdb_apps/antiyoy/images/unit_knight.svg">
                 <span class="price">Price:40G</span>
            </div>
        </div>
        <div class="storeContainer2">
            <div>
                <img class="storeUnit" id="5" src="https://tinkr.tech//sdb_apps/antiyoy/images/building_farm.svg">
                <span class="price">Price:12G (+2G per each you own)</span>
            </div>
             <div>
                <img class="storeUnit" id="6" src="https://tinkr.tech//sdb_apps/antiyoy/images/building_tower.svg">
                <span class="price">Price:15G</span>
             </div>
            <div>
                <img class="storeUnit" id="7" src="https://tinkr.tech//sdb_apps/antiyoy/images/building_fortress.svg">
                <span class="price">Price:35G</span>
            </div>
        </div>



	    <script src="script.js"></script>
    </body>
</html>
